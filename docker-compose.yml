# docker-compose.yml
# 多应用模式：每个应用独立服务
# 使用前请先执行 deno task build 构建
# 首次启动可挂载 Deno 缓存加速：deno cache 后挂载 runtime/deno-cache

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: dweb-admin-backend
    restart: unless-stopped
    stop_grace_period: 5s
    user: '0:0'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      # Reach Mongo published on the host (dev container, 127.0.0.1:27018).
      # Set before the app loads .env so DB_HOST=127.0.0.1 inside the file does not win.
      DB_HOST: host.docker.internal
    ports:
      - '0.0.0.0:${HOST_PORT_BACKEND:-3000}:3000'
    command: ["deno","run","-A","dist/backend/server.js"]
    volumes:
      - .:/app
      - ${DENO_CACHE_DIR:-./runtime/deno-cache}:/deno-dir
    healthcheck:
      # 用 /proc/net/tcp 检测端口（3000 → 0BB8）
      test: ['CMD-SHELL', 'grep -q "0BB8" /proc/net/tcp 2>/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: dweb-admin-frontend
    restart: unless-stopped
    stop_grace_period: 5s
    user: '0:0'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DB_HOST: host.docker.internal
    ports:
      - '0.0.0.0:${HOST_PORT_FRONTEND:-3001}:3001'
    command: ["deno","run","-A","dist/frontend/server.js"]
    volumes:
      - .:/app
      - ${DENO_CACHE_DIR:-./runtime/deno-cache}:/deno-dir
    healthcheck:
      # 用 /proc/net/tcp 检测端口（3001 → 0BB9）
      test: ['CMD-SHELL', 'grep -q "0BB9" /proc/net/tcp 2>/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'

  mobile:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: dweb-admin-mobile
    restart: unless-stopped
    stop_grace_period: 5s
    user: '0:0'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DB_HOST: host.docker.internal
    ports:
      - '0.0.0.0:${HOST_PORT_MOBILE:-3002}:3002'
    command: ["deno","run","-A","dist/mobile/server.js"]
    volumes:
      - .:/app
      - ${DENO_CACHE_DIR:-./runtime/deno-cache}:/deno-dir
    healthcheck:
      # 用 /proc/net/tcp 检测端口（3002 → 0BBA）
      test: ['CMD-SHELL', 'grep -q "0BBA" /proc/net/tcp 2>/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: dweb-admin-api
    restart: unless-stopped
    stop_grace_period: 5s
    user: '0:0'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DB_HOST: host.docker.internal
      # Browser-facing api origin (host-mapped port). Override via .env API_PUBLIC_BASE.
      API_PUBLIC_BASE: ${API_PUBLIC_BASE:-http://127.0.0.1:3003}
    ports:
      - '0.0.0.0:${HOST_PORT_API:-3003}:3003'
    command: ["deno","run","-A","dist/api/server.js"]
    volumes:
      - .:/app
      - ${DENO_CACHE_DIR:-./runtime/deno-cache}:/deno-dir
    healthcheck:
      # 用 /proc/net/tcp 检测端口（3003 → 0BBB）
      test: ['CMD-SHELL', 'grep -q "0BBB" /proc/net/tcp 2>/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'

networks:
  default:
    driver: bridge
