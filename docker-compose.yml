# docker-compose.yml
# 多应用模式：每个应用独立服务
# 使用前请先执行 deno task build 构建
# 首次启动可挂载 Deno 缓存加速：deno cache 后挂载 runtime/deno-cache

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: dweb-admin-backend
    restart: unless-stopped
    stop_grace_period: 5s
    user: '0:0'
    ports:
      - '0.0.0.0:3000:3000'
    command: ["deno","run","-A","dist/backend/server.js"]
    volumes:
      - .:/app
      - ${DENO_CACHE_DIR:-./runtime/deno-cache}:/deno-dir
    healthcheck:
      # 用 /proc/net/tcp 检测端口（3000 → 0BB8）
      test: ['CMD-SHELL', 'grep -q "0BB8" /proc/net/tcp 2>/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: dweb-admin-frontend
    restart: unless-stopped
    stop_grace_period: 5s
    user: '0:0'
    ports:
      - '0.0.0.0:3001:3001'
    command: ["deno","run","-A","dist/frontend/server.js"]
    volumes:
      - .:/app
      - ${DENO_CACHE_DIR:-./runtime/deno-cache}:/deno-dir
    healthcheck:
      # 用 /proc/net/tcp 检测端口（3001 → 0BB9）
      test: ['CMD-SHELL', 'grep -q "0BB9" /proc/net/tcp 2>/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'

  mobile:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: dweb-admin-mobile
    restart: unless-stopped
    stop_grace_period: 5s
    user: '0:0'
    ports:
      - '0.0.0.0:3002:3002'
    command: ["deno","run","-A","dist/mobile/server.js"]
    volumes:
      - .:/app
      - ${DENO_CACHE_DIR:-./runtime/deno-cache}:/deno-dir
    healthcheck:
      # 用 /proc/net/tcp 检测端口（3002 → 0BBA）
      test: ['CMD-SHELL', 'grep -q "0BBA" /proc/net/tcp 2>/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: dweb-admin-api
    restart: unless-stopped
    stop_grace_period: 5s
    user: '0:0'
    ports:
      - '0.0.0.0:3003:3003'
    command: ["deno","run","-A","dist/api/server.js"]
    volumes:
      - .:/app
      - ${DENO_CACHE_DIR:-./runtime/deno-cache}:/deno-dir
    healthcheck:
      # 用 /proc/net/tcp 检测端口（3003 → 0BBB）
      test: ['CMD-SHELL', 'grep -q "0BBB" /proc/net/tcp 2>/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: 'local'
      options:
        max-size: '10m'
        max-file: '3'
        compress: 'true'

networks:
  default:
    driver: bridge
