# CI: 3 runtime (Deno / Bun / Node 22) × 3 OS (Ubuntu / macOS / Windows).
# Unit + integration + Playwright browser e2e via @dreamer/test.
# Triggers only on `dev`. Bun+Windows browser is allow-fail (continue-on-error).
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DB_HOST: 127.0.0.1
  DB_PORT: "27017"
  DB_NAME: dweb_admin
  DB_USER: ci
  DB_PASS: ci
  DB_AUTH_SOURCE: admin
  APP_HOST: 127.0.0.1
  APP_PORT_BACKEND: "3100"
  APP_PORT_API: "3003"
  ADMIN_COOKIE_SECURE: "0"
  LOGIN_RATE_MAX: "200"
  E2E_BASE: http://127.0.0.1:3100

jobs:
  test:
    name: ${{ matrix.runtime }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        runtime: [deno, bun, node]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 22
        if: matrix.runtime == 'node' || matrix.runtime == 'bun'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Ubuntu: ankane/setup-mongodb 7.0 fails on noble (404). Use mongo:7 via Docker.
      # Do not use mongo:8 (GH runner kernels hit SERVER-121912).
      - name: Start MongoDB (Ubuntu Docker)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name dweb-mongo \
            -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=ci \
            -e MONGO_INITDB_ROOT_PASSWORD=ci \
            -e MONGO_INITDB_DATABASE=dweb_admin \
            mongo:7
          for i in $(seq 1 60); do
            if docker exec dweb-mongo mongosh -u ci -p ci --authenticationDatabase admin \
              --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              echo "MongoDB ready"
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB failed to become ready" >&2
          docker logs dweb-mongo || true
          exit 1

      # macOS / Windows: keep ankane binary install (no Docker daemon on macOS runners by default).
      - name: Start MongoDB (macOS/Windows)
        if: runner.os != 'Linux'
        uses: ankane/setup-mongodb@v1
        with:
          mongodb-version: "7.0"

      - name: Create CI Mongo user (macOS/Windows)
        if: runner.os != 'Linux'
        run: |
          for i in $(seq 1 60); do
            if mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 2
          done
          mongosh --quiet --eval '
            const admin = db.getSiblingDB("admin");
            try {
              admin.createUser({
                user: "ci",
                pwd: "ci",
                roles: [
                  { role: "root", db: "admin" }
                ]
              });
            } catch (e) {
              if (!/already exists/i.test(String(e))) throw e;
            }
            const app = db.getSiblingDB("dweb_admin");
            try {
              app.createUser({
                user: "ci",
                pwd: "ci",
                roles: [
                  { role: "readWrite", db: "dweb_admin" },
                  { role: "dbAdmin", db: "dweb_admin" }
                ]
              });
            } catch (e) {
              if (!/already exists/i.test(String(e))) throw e;
            }
            app.createCollection("_ci");
            print("ci user ready");
          '

      - name: Env for CI
        run: |
          cp .env.example .env
          printf '%s\n' \
            'DB_HOST=127.0.0.1' \
            'DB_PORT=27017' \
            'DB_NAME=dweb_admin' \
            'DB_USER=ci' \
            'DB_PASS=ci' \
            'DB_AUTH_SOURCE=admin' \
            'APP_HOST=127.0.0.1' \
            'APP_PORT_BACKEND=3100' \
            'APP_PORT_API=3003' \
            'ADMIN_COOKIE_SECURE=0' \
            'LOGIN_RATE_MAX=200' \
            'E2E_BASE=http://127.0.0.1:3100' >> .env

      # Restore sanitized seed fixtures (admin/admin888 + menus/RBAC/site_settings).
      - name: Restore Mongo fixtures (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          docker exec dweb-mongo mkdir -p /tmp/dweb-fixture
          docker cp tests/fixtures/mongo/. dweb-mongo:/tmp/dweb-fixture/
          docker exec dweb-mongo mongorestore --drop \
            -u ci -p ci --authenticationDatabase admin \
            -d dweb_admin /tmp/dweb-fixture
          docker exec dweb-mongo mongosh -u ci -p ci --authenticationDatabase admin --quiet --eval '
            const dbn = db.getSiblingDB("dweb_admin");
            const u = dbn.admin_users.findOne({username:"admin"});
            if (!u) throw new Error("fixture missing admin");
            print("fixture ok admin_users=" + dbn.admin_users.countDocuments() +
              " menus=" + dbn.menus.countDocuments() +
              " auth_routes=" + dbn.auth_routes.countDocuments());
          '

      - name: Install MongoDB Database Tools (macOS/Windows)
        if: runner.os != 'Linux'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew list mongodb-database-tools >/dev/null 2>&1 || brew install mongodb-database-tools
          else
            # Windows: bash shell — use RUNNER_TEMP (do not use PowerShell $env: inside bash).
            TOOLS_VER=100.10.0
            ZIP="mongodb-database-tools-windows-x86_64-${TOOLS_VER}.zip"
            curl -fsSL -o "${RUNNER_TEMP}/${ZIP}" "https://fastdl.mongodb.org/tools/db/${ZIP}"
            rm -rf "${RUNNER_TEMP}/mdbt"
            mkdir -p "${RUNNER_TEMP}/mdbt"
            unzip -o "${RUNNER_TEMP}/${ZIP}" -d "${RUNNER_TEMP}/mdbt"
            TOOLS_BIN="${RUNNER_TEMP}/mdbt/mongodb-database-tools-windows-x86_64-${TOOLS_VER}/bin"
            echo "${TOOLS_BIN}" >> "$GITHUB_PATH"
            export PATH="${TOOLS_BIN}:$PATH"
            mongorestore --version
          fi

      - name: Restore Mongo fixtures (macOS/Windows)
        if: runner.os != 'Linux'
        run: |
          mongorestore --drop \
            --uri="mongodb://ci:ci@127.0.0.1:27017/?authSource=admin" \
            -d dweb_admin tests/fixtures/mongo
          mongosh --quiet --eval '
            const dbn = db.getSiblingDB("dweb_admin");
            const u = dbn.admin_users.findOne({username:"admin"});
            if (!u) throw new Error("fixture missing admin");
            print("fixture ok admin_users=" + dbn.admin_users.countDocuments() +
              " menus=" + dbn.menus.countDocuments() +
              " auth_routes=" + dbn.auth_routes.countDocuments());
          '

      - name: Cache Deno deps
        if: matrix.runtime == 'deno'
        continue-on-error: true
        run: deno cache backend/main.ts api/main.ts

      - name: Install npm deps (Node)
        if: matrix.runtime == 'node'
        run: npm install

      - name: Install bun deps
        if: matrix.runtime == 'bun'
        run: bun install

      - name: Install Playwright Chromium
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            npx -y playwright@1.59.1 install --with-deps chromium
          else
            npx -y playwright@1.59.1 install chromium
          fi

      - name: Check (Deno)
        if: matrix.runtime == 'deno'
        run: deno task check

      - name: Start backend (Deno)
        run: |
          deno run --env-file=.env -A backend/main.ts --dev &
          echo $! > /tmp/dweb-backend.pid
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:3100/api/health && exit 0
            sleep 1
          done
          echo "backend failed to become healthy" >&2
          exit 1

      - name: Start API (Deno)
        run: |
          deno run --env-file=.env -A api/main.ts --dev &
          echo $! > /tmp/dweb-api.pid
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3003/health \
              || curl -sf http://127.0.0.1:3003/api/health \
              || curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:3003/ | grep -qE '^[0-9]{3}$'; then
              echo "api ready"
              exit 0
            fi
            sleep 1
          done
          echo "api failed to become healthy" >&2
          exit 1

      - name: Warm up backend pages (cold compile)
        run: |
          for path in /login / /chat; do
            curl -sf -o /dev/null -w "%{http_code} %{url_effective}\n" "http://127.0.0.1:3100$path" || true
          done
          # Authenticated warm-up so first e2e paint is not a cold compile under Playwright.
          CSRF=$(curl -sf -c /tmp/dweb-ci.ck -b /tmp/dweb-ci.ck http://127.0.0.1:3100/login -o /dev/null -D - | tr -d '\r' | awk -F'=|;' 'BEGIN{IGNORECASE=1} /set-cookie: _csrf=/{print $2; exit}')
          CSRF=${CSRF:-$(awk '$6=="_csrf"{print $7}' /tmp/dweb-ci.ck)}
          curl -sf -c /tmp/dweb-ci.ck -b /tmp/dweb-ci.ck             -H "content-type: application/json" -H "x-csrf-token: ${CSRF}"             -d '{"username":"admin","password":"admin888"}'             http://127.0.0.1:3100/api/auth/login >/tmp/dweb-login.json || true
          for path in / /chat /rbac/admins /user /developer/menus; do
            curl -sf -o /dev/null -b /tmp/dweb-ci.ck -w "%{http_code} %{url_effective}\n" "http://127.0.0.1:3100$path" || true
          done

      - name: Test unit + integration (Deno)
        if: matrix.runtime == 'deno'
        run: deno test --env-file=.env -A tests/unit/ tests/api/ tests/integration/

      - name: Test browser e2e (Deno)
        if: matrix.runtime == 'deno'
        run: deno test --env-file=.env -A tests/e2e/

      - name: Test unit + integration (Bun)
        if: matrix.runtime == 'bun'
        run: bun run test:bun:unit

      - name: Test browser e2e (Bun)
        if: matrix.runtime == 'bun' && runner.os != 'Windows'
        run: bun run test:bun:e2e

      - name: Bun+Windows browser (allow-fail)
        if: matrix.runtime == 'bun' && runner.os == 'Windows'
        continue-on-error: true
        run: bun run test:bun:e2e

      - name: Test unit (Node)
        if: matrix.runtime == 'node'
        run: npm run test:node

      - name: Test api (Node)
        if: matrix.runtime == 'node'
        run: npm run test:node:api

      - name: Test integration (Node)
        if: matrix.runtime == 'node'
        run: npm run test:node:integration

      - name: Test browser e2e (Node)
        if: matrix.runtime == 'node'
        run: npm run test:node:e2e
